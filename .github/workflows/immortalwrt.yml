name: ImmortalWrt x86_64

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 02:00 (UTC 18:00) 自动编译
    - cron: '0 18 * * *'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: immortalwrt/x86_64/defconfig
  DIY_P1_SH: immortalwrt/diy-part1.sh
  DIY_P2_SH: immortalwrt/diy-part2.sh
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix line endings
        run: |
          find $GITHUB_WORKSPACE/files $GITHUB_WORKSPACE/immortalwrt -type f -exec sed -i 's/\r$//' {} +

      - name: Initialize the compilation environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev swig \
            libpython3-dev aria2 qemu-utils ccache rename libelf-dev
          sudo timedatectl set-timezone "$TZ"

      - name: Clone ImmortalWrt source
        run: git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: Update & install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: DIY part1 (third-party packages)
        run: |
          chmod +x $GITHUB_WORKSPACE/immortalwrt/*.sh
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Load config & DIY part2
        run: |
          cat "$CONFIG_FILE" > openwrt/.config
          cp -rf $GITHUB_WORKSPACE/files $GITHUB_WORKSPACE/openwrt/files
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download packages
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(nproc)
          find dl -size -1024c -delete

      - name: Compile the firmware
        id: compile
        working-directory: ./openwrt
        run: |
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize firmware files
        if: steps.compile.outputs.status == 'success'
        working-directory: ./openwrt/bin/targets/x86/64
        run: |
          rm -rf packages *.json *.buildinfo *.manifest *.config sha256sums *rootfs.tar.gz
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt-x86_64-${{ env.date }}
          path: ${{ env.FIRMWARE }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: steps.compile.outputs.status == 'success'
        with:
          tag_name: ${{ env.date }}
          name: ImmortalWrt x86_64 ${{ env.date }}
          files: ${{ env.FIRMWARE }}/*
